name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # test-integration runs against a real apiserver, which is the point: what
      # it checks is what actually happens in one, and a fake would only confirm
      # the code calls the functions it calls.
      - name: Tests
        run: make test
